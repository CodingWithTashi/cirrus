name: last_puff
description: "LastPuff — the honest, AI-native quit-vaping app. UI/UX build (MVVM, in-memory data)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (MVVM view models) — founder-locked in docs/05.
  flutter_riverpod: ^2.6.1
  # Declarative navigation + deep-linkable routes — founder-locked in docs/05.
  go_router: ^16.0.0
  # Currency / date / number formatting for l10n.
  intl: any
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  firebase_messaging: ^16.5.0
  firebase_auth: ^6.5.7
  # Native Google account sheet (Android); Apple sign-in needs no package —
  # firebase_auth's AppleAuthProvider drives the native sheet on iOS.
  google_sign_in: ^7.2.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
