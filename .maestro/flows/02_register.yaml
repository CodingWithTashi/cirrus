# Create a new account → onboarding welcome screen.
appId: "${maestro.platform == 'android' ? 'com.quitvape.last_puff' : 'com.quitvape.lastPuff'}"
env:
  PASSWORD: cirrus-demo
name: 'Register creates an account and opens onboarding'
tags:
  - auth
  - smoke
---
- runFlow: ../shared/launch.yaml
- runFlow: ../shared/register.yaml
# An account made before any answers is handed back to the top of the quiz.
- extendedWaitUntil:
    visible: 'How dependent are you, really\?'
    timeout: 30000
- assertVisible: 'Start my check-up'
