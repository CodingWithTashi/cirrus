# From the welcome screen or the sign-in screen: log into the existing account
# and land on Home.
# Happy path only — 01_sign_in.yaml covers the wrong-password branch.
appId: "${maestro.platform == 'android' ? 'com.quitvape.last_puff' : 'com.quitvape.lastPuff'}"
---
# A cold start lands on the quiz now, so the sign-in screen is one tap further:
# the welcome screen's "Log in". Skipped when this runs from the sign-in screen
# itself (after a sign-out, or at the account ask that follows the commit).
- runFlow:
    when:
      visible: 'Start my check-up'
    commands:
      - tapOn: 'Already have an account\? Log in'
      - extendedWaitUntil:
          visible: 'Continue with email'
          timeout: 10000
- tapOn: 'Continue with email'
- assertVisible: 'Create your account'
- runFlow: dismiss_keyboard.yaml
- tapOn: 'Already have one\? Log in'
- assertVisible: 'Welcome back.'
- tapOn:
    below:
      text: 'EMAIL'
    index: 0
- eraseText
- inputText: ${EMAIL}
- tapOn:
    below:
      text: 'PASSWORD'
    index: 0
- inputText: ${PASSWORD}
- runFlow: dismiss_keyboard.yaml
- tapOn: 'Log in'
- extendedWaitUntil:
    visible: 'LOG PUFF'
    timeout: 30000
