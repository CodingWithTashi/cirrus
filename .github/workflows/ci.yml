name: Flutter checks

# Analyzes and tests the app on every push and pull request. Nothing ships from here:
# release.yml calls this workflow first, then ships to the stores by hand.
# Commits that only touch the landing site, the docs, the Firebase Hosting page or the release
# tooling skip it. functions/** and firestore.* still run it: the Dart tests read those files to
# pin client/server parity. The functions gate and the emulator suites are in functions.yml.
on:
  push:
    branches: [main]
    paths-ignore: &paths-ignore
      - 'cirrus-landing/**'
      - 'docs/**'
      - 'hosting/**'
      - '.github/workflows/functions.yml'
      - '.github/workflows/cirrus-landing-deploy.yml'
      - '.github/workflows/release.yml'
      - 'fastlane/**'
      - 'Gemfile'
      - 'Gemfile.lock'
  pull_request:
    branches: [main]
    paths-ignore: *paths-ignore
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml # environment: flutter, the app's one pin.
          cache: true

      - run: flutter pub get
      # The generated localizations are committed; regenerating proves they match the ARB files.
      - run: flutter gen-l10n
      - name: Fail if generated l10n is stale
        run: git diff --exit-code lib/l10n/gen
      - run: flutter analyze
      - run: flutter test
