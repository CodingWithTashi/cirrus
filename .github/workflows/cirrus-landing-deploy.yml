name: Deploy cirrus-landing

# Manual only. The Flutter app and the landing page share this repo, so nothing
# here fires on push — run it from Actions -> "Deploy cirrus-landing" -> Run workflow
# and pick the target with the dropdown.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare Pages target
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production

concurrency:
  group: cirrus-landing-${{ inputs.environment }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cirrus-landing

jobs:
  deploy:
    name: Build and deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: cirrus-landing/.nvmrc
          cache: npm
          cache-dependency-path: cirrus-landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Catches broken links to content, bad prop types, and — via the content
      # collection schema — any blog post with a missing or over-long title or
      # meta description, before it can reach the live site. It also runs
      # scripts/check-i18n.mjs over every translation: keys, placeholders, digits
      # (a translated "76%" must still be 76), lengths and duplicate questions.
      - name: Typecheck
        run: npm run check

      # A PREVIEW deploy also builds the languages that are written but not yet
      # published, so a translation can be read on a real URL and a real phone
      # before it goes live. Production never sets this: it serves exactly the
      # locales listed as PUBLISHED in src/i18n/locales.mjs. Cloudflare sends
      # `X-Robots-Tag: noindex` on every preview deploy, so nothing built here
      # can reach a search index.
      - name: Build
        run: npm run build
        env:
          CIRRUS_PREVIEW_LOCALES: ${{ inputs.environment == 'preview' && 'es,fr,de,pt' || '' }}

      # Reads dist/, so it has to come after the build. Catches what the
      # typecheck structurally cannot: a canonical that does not match its URL,
      # one FAQ question emitted as schema on two pages, an internal link or
      # #anchor that resolves to nothing, and a sitemap that disagrees with
      # which pages are indexable.
      - name: Verify built site
        run: npm run verify

      # Deploy with the wrangler pinned in package-lock.json, so CI and a local
      # `npm run deploy` run the exact same version. Project name and output dir
      # come from cirrus-landing/wrangler.jsonc.
      #
      # Cloudflare Pages decides production vs preview from the branch name: the
      # project's production branch (main) publishes to cirrusquit.com, any other
      # name gets a preview URL.
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy --branch="$BRANCH" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ inputs.environment == 'production' && 'main' || format('preview-{0}', github.ref_name) }}
