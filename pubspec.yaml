name: last_puff
description: "Cirrus — the honest, AI-native quit-vaping app."
publish_to: 'none'

version: 1.0.6+7

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (MVVM view models) — founder-locked in docs/05.
  flutter_riverpod: ^2.6.1
  # Declarative navigation + deep-linkable routes — founder-locked in docs/05.
  go_router: ^16.0.0
  # Currency / date / number formatting for l10n.
  intl: any
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  firebase_messaging: ^16.5.0
  firebase_auth: ^6.5.7
  # Native Google account sheet (Android); Apple sign-in needs no package —
  # firebase_auth's AppleAuthProvider drives the native sheet on iOS.
  google_sign_in: ^7.2.0

  cloud_functions: ^6.4.0
  firebase_app_check: ^0.4.7
  flutter_timezone: ^5.1.0
  shared_preferences: ^2.5.5
  # Opens the under-18 quit resources. Those are real destinations — an SMS
  # shortcode and a live site — and someone we have just told we cannot coach
  # should not have to copy a string and find their own way there.
  url_launcher: ^6.3.1
  # The native store review sheet. Wrapped in `core/utils/lp_review.dart`:
  # neither platform tells you whether the sheet appeared or what the user
  # did, so nothing in the UI may claim a rating was submitted.
  in_app_review: ^2.0.10
  firebase_crashlytics: ^5.3.0
  firebase_analytics: ^12.5.0
  flutter_local_notifications: ^22.3.0
  # Needed by flutter_local_notifications' zonedSchedule: a repeating daily
  # alarm has to be anchored in a real timezone, or DST silently shifts it.
  timezone: ^0.11.1
  amplitude_flutter: ^4.7.1
  showcaseview: ^5.1.0
  purchases_flutter: ^10.10.1
  package_info_plus: ^10.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the real app on a real device — the only harness that can prove the
  # Firebase repositories, the router and the platform channels actually work
  # together. Widget tests pin behaviour; these pin integration.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Build-time only: `dart run flutter_launcher_icons` (see the block below).
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Launcher icons — regenerate with `dart run flutter_launcher_icons` after
# changing any source art below. The generated files under android/ios are
# committed, so this only needs to run when the art changes.
#
# Two things the generator does that must be undone afterwards: it rewrites
# ios/Runner.xcodeproj/project.pbxproj, clobbering
# ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS from YES to
# "AppIcon" (a loose match on the ASSETCATALOG_COMPILER_ prefix — the real
# APPICON_NAME setting is already correct, so just `git checkout` that file),
# and it minifies AppIcon.appiconset/Contents.json onto one line.
flutter_launcher_icons:
  # Full artwork: legacy Android mipmaps + every iOS size.
  image_path: "assets/images/cirrus.png"
  android: "ic_launcher"
  min_sdk_android: 21

  # Adaptive icon (Android 8+). The artwork's own corners are exactly #0A0C10,
  # so a matching flat background makes the inset seam invisible under every
  # launcher mask — the art square is clipped by the mask, but only ever against
  # its own colour. The inset is not cosmetic: the mark spans 90% of the source
  # height and the small dot sits on the art's circumscribed circle, so at the
  # default inset a round mask cuts the swirl's tail and the dot. 21% lands the
  # whole mark inside the 66dp circle Android guarantees is never masked.
  adaptive_icon_background: "#0A0C10"
  adaptive_icon_foreground: "assets/images/cirrus.png"
  adaptive_icon_foreground_inset: 21

  # Themed icon (Android 13+): a solid silhouette of the swirl, generated from
  # the artwork by high-passing the glow away. Without it, themed launchers fall
  # back to the colour icon.
  adaptive_icon_monochrome: "assets/images/cirrus_monochrome.png"

  ios: true
  # App Store rejects an icon with an alpha channel; the source has none today,
  # but this keeps that true if the art is ever re-exported with one.
  remove_alpha_ios: true
