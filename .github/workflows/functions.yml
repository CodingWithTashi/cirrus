name: Cloud Functions checks

# The Cloud Functions gate and the Firestore rules and integration suites, on every push and pull
# request that touches the backend. The emulator jobs matter most: the security-rules suite and the
# concurrency tests both found live defects that unit tests could not have. Deploys stay manual.
on:
  push:
    branches: [main]
    paths: &backend-paths
      - functions/**
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
      - .github/workflows/functions.yml
  pull_request:
    branches: [main]
    paths: *backend-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push makes an in-flight run irrelevant; cancel it rather than
  # queueing behind it.
  group: functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: Functions — verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      # typecheck + lint + the pure suite — the same gate the deploy
      # predeploy hook runs, so a red CI means a blocked deploy.
      - run: npm run verify

  emulator:
    name: Firestore emulator — rules & integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install -g firebase-tools
      - run: npm run test:rules
      - run: npm run test:integration
